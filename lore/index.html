<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- <title>maujim.</title> -->
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 56px auto;
        max-width: 680px;
        line-height: 1.45;
        font-size: 17px;
        color: #2f2f2f;
        padding: 0 16px;
        background: #f3f3f3;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      #boids-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      header,
      main,
      footer {
        position: relative;
        z-index: 1;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 44px;
        line-height: 1.1;
        font-weight: 520;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 28px;
        color: #666;
      }

      .section-label {
        margin: 34px 0 10px;
        font-size: 15px;
        font-weight: 500;
        color: #8a8a8a;
      }

      .list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .item-link {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 18px;
        padding: 12px 12px;
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .item-link:hover {
        background: #e9e9e9;
      }

      .lore-entry {
        cursor: default;
      }

      .item-main {
        min-width: 0;
      }

      .item-title {
        margin: 0;
        font-size: 23px;
        line-height: 1.25;
        font-weight: 520;
        letter-spacing: -0.01em;
      }

      .item-subtitle {
        margin: 3px 0 0;
        font-size: 17px;
        line-height: 1.35;
        color: #666;
      }

      .item-meta {
        align-self: start;
        margin-top: 1px;
        min-width: 52px;
        text-align: right;
        font-size: 18px;
        color: #777;
        white-space: nowrap;
      }

      footer {
        margin-top: 34px;
        padding: 0 12px;
      }

      .back-link {
        color: #777;
        font-size: 15px;
        font-weight: 500;
        text-decoration-color: #aaa;
        text-underline-offset: 3px;
      }

      .back-link:hover {
        color: #2f2f2f;
        text-decoration-color: currentColor;
      }
    </style>
  </head>
  <body>
    <canvas id="boids-canvas" aria-hidden="true"></canvas>
    <header>
      <h1>mukund singh mauji</h1>
      <p>probablitity distributions rule everything around me</p>
    </header>

    <main>
      <h2 class="section-label">lore</h2>
      <ul class="list">
        <li class="item">
          <div class="item-link lore-entry">
            <div class="item-main">
              <h3 class="item-title">Software Engineer</h3>
              <p class="item-subtitle">Independent</p>
            </div>
          </div>
        </li>

        <li class="item">
          <a class="item-link" href="https://search.brave.com">
            <div class="item-main">
              <h3 class="item-title">Search Engineer</h3>
              <p class="item-subtitle">Brave Software</p>
            </div>
          </a>
        </li>

        <li class="item">
          <a class="item-link" href="https://mosaicmfg.com">
            <div class="item-main">
              <h3 class="item-title">Firmware Engineer</h3>
              <p class="item-subtitle">Mosaic Manufacturing</p>
            </div>
          </a>
        </li>

        <li class="item">
          <a class="item-link" href="/assets/degree-details/M11.pdf">
            <div class="item-main">
              <h3 class="item-title">
                B.A.Sc. in Mathematics and Engineering
              </h3>
              <p class="item-subtitle">
                Queen's University, Kingston
              </p>
            </div>
          </a>
        </li>
      </ul>
    </main>
    <footer>
      <a class="back-link" href="/">← back</a>
    </footer>
    <script src="/javascript/boids-background.js" defer></script>
  </body>
</html>
